name: Build Husk IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "project.yml"
      - "Husk.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build IPA on macOS
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install build tools
        run: |
          brew update
          brew install meson ninja pkg-config xcodegen qemu rust

      - name: Add iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Build Husk and package IPA
        run: ./scripts/ci_build.sh build/Husk.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-IPA
          path: |
            build/Husk.ipa
            build/Husk.tipa
          if-no-files-found: error
          retention-days: 7
