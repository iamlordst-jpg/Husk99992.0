name: Build Husk IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "patches/**"
      - "project.yml"
      - "Husk.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build IPA on macOS
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install build tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install meson ninja pkg-config xcodegen
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check PyYAML
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Add iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Restore compiled dependencies and source caches
        uses: actions/cache@v4
        with:
          path: |
            build/
            third_party/build/
            third_party/sources/
            third_party/gpu/
          key: husk-ios-macos15-xcode16-${{ hashFiles('scripts/**', 'patches/**') }}

      - name: Build Husk and package IPA
        run: ./scripts/ci_build.sh build/Husk.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-IPA
          path: |
            build/Husk.ipa
            build/Husk.tipa
          if-no-files-found: error
          retention-days: 7
